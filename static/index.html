<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picam API</title>
<style>
  :root { --bg:#0b0d12; --panel:#141821; --line:#232a36; --ink:#e7ecf3;
          --dim:#8b95a6; --acc:#ffcd3c; --ok:#46d296; --err:#ff6464; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { padding:14px 18px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  #health { color:var(--dim); font-size:12px; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px;
          max-width:1100px; }
  @media (max-width:760px){ .wrap{ grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line);
          border-radius:10px; padding:14px; }
  .card h2 { margin:0 0 10px; font-size:13px; color:var(--acc);
             text-transform:uppercase; letter-spacing:.6px; }
  button { background:#1d2431; color:var(--ink); border:1px solid var(--line);
           border-radius:7px; padding:7px 11px; font:inherit; cursor:pointer;
           margin:0 6px 6px 0; }
  button:hover { border-color:var(--acc); }
  input { background:#0e1219; color:var(--ink); border:1px solid var(--line);
          border-radius:6px; padding:5px 7px; width:64px; font:inherit; }
  label { color:var(--dim); font-size:12px; margin-right:8px; }
  img#view { width:100%; border:1px solid var(--line); border-radius:8px;
             background:#000; aspect-ratio:4/3; object-fit:contain; }
  #log { grid-column:1/-1; background:#080a0e; border:1px solid var(--line);
         border-radius:10px; padding:12px; height:180px; overflow:auto;
         white-space:pre-wrap; font-size:12.5px; color:#cfe; }
  .ok{color:var(--ok)} .err{color:var(--err)} .dim{color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>picam API</h1>
  <span id="health">connecting...</span>
</header>

<div class="wrap">
  <div class="card">
    <h2>live view</h2>
    <img id="view" alt="stream">
    <div style="margin-top:10px">
      <button onclick="toggleStream()">toggle stream</button>
      <button onclick="hit('/api/capture?save=1')">save photo</button>
      <button onclick="window.open('/api/capture','_blank')">snapshot</button>
    </div>
  </div>

  <div class="card">
    <h2>pico frame</h2>
    <button onclick="hit('/api/pico/find')">find pico</button>
    <button onclick="post('/api/pico/push')">push frame</button>
    <button onclick="post('/api/pico/push?store=1')">push to gallery</button>
    <button onclick="post('/api/pico/clear')">clear</button>
    <button onclick="hit('/api/pico/list')">list</button>
    <div style="margin-top:8px">
      <label>mirror fps</label><input id="mfps" value="2">
      <button onclick="post('/api/pico/mirror/start?fps='+val('mfps'))">mirror start</button>
      <button onclick="post('/api/pico/mirror/stop')">mirror stop</button>
    </div>
  </div>

  <div class="card">
    <h2>timelapse</h2>
    <label>interval s</label><input id="tint" value="5">
    <label>count</label><input id="tcnt" value="0">
    <div style="margin-top:8px">
      <button onclick="post('/api/timelapse/start?interval='+val('tint')+'&count='+val('tcnt'))">start</button>
      <button onclick="post('/api/timelapse/stop')">stop</button>
      <button onclick="hit('/api/timelapse/status')">status</button>
      <button onclick="hit('/api/timelapse/list')">list</button>
    </div>
  </div>

  <div class="card">
    <h2>motion + qr</h2>
    <label>threshold</label><input id="mth" value="6">
    <label>push pico</label><input id="mpush" value="0" style="width:32px">
    <div style="margin-top:8px">
      <button onclick="post('/api/motion/start?threshold='+val('mth')+'&push='+val('mpush'))">motion start</button>
      <button onclick="post('/api/motion/stop')">motion stop</button>
      <button onclick="hit('/api/motion/status')">motion status</button>
    </div>
    <div style="margin-top:8px">
      <button onclick="hit('/api/qr/scan')">scan QR / barcode</button>
    </div>
  </div>

  <div id="log"></div>
</div>

<script>
  const logEl = document.getElementById('log');
  function log(msg, cls){ const l=document.createElement('div');
    if(cls) l.className=cls; l.textContent=new Date().toLocaleTimeString()+'  '+msg;
    logEl.prepend(l); }
  function val(id){ return document.getElementById(id).value.trim(); }

  async function req(path, method){
    try {
      const r = await fetch(path, {method:method||'GET'});
      const t = await r.text();
      log(method||'GET' + ' ' + path + '  ->  ' + t, r.ok?'ok':'err');
    } catch(e){ log(path + '  FAILED  ' + e, 'err'); }
  }
  const hit  = p => req(p, 'GET');
  const post = p => req(p, 'POST');

  let streaming=false;
  function toggleStream(){
    const v=document.getElementById('view');
    streaming=!streaming;
    v.src = streaming ? '/api/stream?ts='+Date.now() : '';
    log('stream '+(streaming?'on':'off'),'dim');
  }

  async function health(){
    try{
      const r=await fetch('/api/health'); const j=await r.json();
      document.getElementById('health').textContent =
        (j.mock?'MOCK camera':'camera live')+' · '+j.frames+' frames · '+j.size.join('x');
    }catch(e){ document.getElementById('health').textContent='offline'; }
  }
  health(); setInterval(health, 3000);
  toggleStream();   // autostart live view
</script>
</body>
</html>
